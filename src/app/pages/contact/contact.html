<section class="p-6 max-w-lg mx-auto">
  <h1 class="text-3xl font-bold mb-6">Contact</h1>

  <div class="card bg-base-100 shadow-sm border border-base-300">
    <form class="card-body space-y-3">
      <label class="form-control">
        <span class="label label-text">Nom</span>
        <input type="text" placeholder="Votre nom" class="input input-bordered w-full" />
      </label>

      <label class="form-control">
        <span class="label label-text">Email</span>
        <input type="email" placeholder="vous@exemple.com" class="input input-bordered w-full" />
      </label>

      <label class="form-control">
        <span class="label label-text">Message</span>
        <textarea class="textarea textarea-bordered w-full" rows="4" placeholder="Votre message..."></textarea>
      </label>

      <div class="card-actions justify-end pt-2">
        <button type="submit" class="btn btn-primary">Envoyer</button>
      </div>
    </form>
  </div>
</section>
