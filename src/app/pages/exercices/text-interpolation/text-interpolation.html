
<div class="overflow-x-auto">
  <table class="table">
    <!-- head -->
    <thead>
      <tr>
        <th>Type</th>
        <th>Exemple</th>
        <th>Commentaire</th>
      </tr>
    </thead>
    <tbody>
      <!-- row 1 -->
      <tr>
        <td>String</td>
        <td>{{uneString}}</td>
        <td>une chaine de charactère</td>
      </tr>
      <!-- row 2 -->
      <tr>
        <td>Nombre</td>
        <td>{{unNumber * 2}}</td>
        <td>des nombres</td>
      </tr>
      <!-- row 3 -->
      <tr>
        <td>Un boolean</td>
        <td>{{unBoolean}}</td>
        <td>true or false</td>
      </tr>
      <!-- row 4 -->
      <tr>
        <td>Un tableau</td>
        <td>{{unArray | json }}</td>
        <td>Monalisa</td>
      </tr>
      <!-- row 5 -->
      <tr>
        <td>Un Object</td>
        <td>{{unObject | json}}</td>
        <td>un dictionnaire</td>
      </tr>
</table>
</div>
